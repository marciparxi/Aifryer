<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Airfryer">
<meta name="theme-color" content="#e8590c">
<title>Airfryer na internáte</title>
<style>
:root{--bg:#fff8f0;--fg:#2b2118;--card:#fff;--ac:#e8590c;--mu:#7a6a5c;--bd:#eadccc;--ok:#2f9e44}
@media(prefers-color-scheme:dark){:root{--bg:#1c1612;--fg:#f4ebe2;--card:#2a221b;--mu:#b5a493;--bd:#3d3228}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px 2px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font-size:14px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;overflow:hidden}
.card h3{margin:0 0 4px;font-size:17px}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;background:var(--bd);border-radius:99px;padding:2px 9px;margin:2px 3px 2px 0;font-size:13px}
.tag.have{background:var(--ok);color:#fff}.tag.miss{background:#fff0e0;color:#a04000}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:16px system-ui;margin-bottom:6px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;text-decoration:none;display:inline-block;margin:4px 4px 0 0}
.row{display:flex;gap:6px}.row input{flex:1}
details summary{cursor:pointer;color:var(--ac);margin-top:6px}
ol{padding-left:20px;margin:6px 0}.x{cursor:pointer}
img.ph{width:100%;border-radius:10px;margin:6px 0 2px;max-height:260px;object-fit:cover}
.real{background:#fff0e0;color:#7a3500;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
@media(prefers-color-scheme:dark){.real{background:#3a2a1a;color:#ffd9b0}}
.deal{display:flex;align-items:center;gap:12px;border-radius:14px;padding:12px;margin-bottom:10px;color:#fff;position:relative}
.deal .pc{font-size:34px;font-weight:800;min-width:92px;text-align:center;background:rgba(255,255,255,.2);border-radius:12px;padding:8px 4px}
.deal .st{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.9}
.deal .it{font-size:20px;font-weight:700;text-transform:capitalize}
.deal.Lidl{background:linear-gradient(135deg,#0050aa,#0a7bd6)}.deal.Billa{background:linear-gradient(135deg,#e6a100,#d4380d)}.deal.Tesco{background:linear-gradient(135deg,#00539f,#e51d2a)}
.deal .rare{position:absolute;top:-8px;right:10px;background:#ffd43b;color:#7a3500;font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px}
.deal .x{position:absolute;bottom:6px;right:10px;font-size:13px;opacity:.8}
.chips{margin-bottom:8px}
</style></head><body><main>
<h1>🍟 Airfryer na internáte</h1>
<nav><button data-t="r">Recepty</button><button data-t="p">Doma</button><button data-t="d">Zľavy</button><button data-t="a">Pridať</button></nav>
<div id="v"></div>
</main>
<script>
// ---- RECEPTY: polia v = odkaz na video (TikTok/Instagram/YouTube), img = odkaz na fotku (ilustračná), real = ako to reálne vyzerá
const R=[
{id:"s1",n:"Kuracie s batátmi",t:"190 °C / 22 min",i:["kuracie prsia","batáty","olej","paprika","soľ","cesnak"],
s:["Kuracie prsia (cca 300 g) nakrájaj na kocky veľké asi 2 cm, batát (1 stredný, cca 250 g) na kocky 1,5 cm. Menšie batáty sa upečú rýchlejšie, preto ich nerob väčšie.","Daj do misky, pridaj 1 PL oleja, 1 ČL sladkej papriky, ½ ČL soli a 1 pretlačený strúčik cesnaku. Dobre premiešaj, aby bolo všetko obalené.","Predhrej airfryer na 190 °C (3 min). Daj do košíka v jednej vrstve, nepreplňaj.","Piekaj 22 min, po 10 min pretrasú. Kuracie je hotové, keď vo vnútri nie je ružové (74 °C).","Ak sú batáty stále tvrdé, pridaj 3 min."],
real:"Batáty budú na okrajoch mierne chrumkavé, vnútri mäkké, nie extra chrumkavé ako hranolky. Kuracie bude skôr suchšie, ak ho prepečieš, preto skontroluj o 2 min skôr.",v:"",img:""},
{id:"s2",n:"Batátové hranolky",t:"200 °C / 15 min",i:["batáty","olej","soľ","paprika"],
s:["Batát nakrájaj na paličky hrubé 1 cm.","Namoč na 10 min do studenej vody, potom dôkladne osuš utierkou. Vďaka tomu budú menej mäkké.","Premiešaj s 1 PL oleja, soľou a ½ ČL papriky.","Piekaj na 200 °C 15 min, v polovici pretras. Rozlož ich v jednej vrstve, inak sa budú dusiť."],
real:"Batátové hranolky nikdy nebudú tak chrumkavé ako zemiakové. Sú mäkšie a trochu sladké, na okrajoch pripečené.",v:"",img:""},
{id:"s3",n:"Cesnakový syrový toast",t:"180 °C / 6 min",i:["chlieb","syr","cesnak","olej"],
s:["2 plátky chleba potri olejom (alebo maslom) a pretlačeným strúčikom cesnaku.","Posyp 40 g strúhaného syra na plátok.","Piekaj na 180 °C 5–6 min, až kým sa syr rozpustí a okraje zozlatnú. Sleduj ho, ľahko sa pripáli."],
real:"S malým množstvom syra bude toast len mierne obalený roztopeným syrom. Pre syrový efekt ako z reklamy treba aspoň 60–80 g na plátok.",v:"",img:""},
{id:"s4",n:"Quesadilla",t:"180 °C / 6 min",i:["tortilla","syr","šunka"],
s:["Na polovicu tortilly daj 50 g syra a 2–3 plátky šunky.","Prelož na polovicu. Aby sa neotvorila, daj navrch malý kovový rošt alebo pekáčik.","Piekaj na 180 °C 3 min, obráť, 3 min. Nechaj 1 min odpočívať a krájaj."],
real:"Tortilla bude chrumkavá len navrchu, vnútri syr stiahnutý a mierne tuhý. Veľmi natiahnutý syr z videí dostaneš len s mozzarellou.",v:"",img:""},
{id:"s5",n:"Brokolica so syrom",t:"190 °C / 10 min",i:["brokolica","syr","cesnak","olej"],
s:["Brokolicu rozdeľ na ružičky a osuš.","Premiešaj s 1 PL oleja, cesnakom a štipkou soli.","Piekaj na 190 °C 8 min.","Posyp syrom a daj ešte na 2 min."],
real:"Konce ružičiek budú pripečené do tmavohneda, a to je normálne, majú chuť. Syr sa len roztopí, nie je to gratinované jedlo.",v:"",img:""}];
R.push({id:"s6",k:"panvica",n:"Cestoviny s cesnakom a syrom (panvica)",t:"15 min",i:["cestoviny","cesnak","syr","olej"],
s:["Uvar 100 g cestovín v osolenej vode podľa obalu, odlej 3 PL vody z varenia.","Na panvici zohrej 1 PL oleja, pridaj 2 pretlačené strúčiky cesnaku a smaž 30 s, nenechaj zhnednúť.","Pridaj cestoviny, odloženú vodu a 40 g strúhaného syra, miešaj 1 min, kým sa vytvorí lesklá omáčka."],
real:"Omáčka z jedného syra bude skôr tenká a obaľujúca, nie hustá ako v reštaurácii. Hustejšia bude, ak dáš viac syra alebo trocha smotany.",v:"",img:""});
const SUB={"kuracie prsia":["kuracie stehná bez kosti","morčacie","tofu"],"batáty":["zemiaky","tekvica","mrkva"],"olej":["maslo","olivový olej"],"med":["cukor + trocha vody","javorový sirup"],"sójová omáčka":["soľ + trocha vody","worcester"],"tortilla":["palacinka","plátky chleba"],"syr":["eidam","mozzarella","niva","tvaroh"],"cesnak":["cesnakový prášok"],"chlieb":["rožok","toastový chlieb"],"strúhanka":["rozdrvené cornflakes","pomleté sucháre"],"brokolica":["karfiol"],"paprika":["akékoľvek korenie","čili"],"šunka":["saláma","slanina","kuracie"],"losos":["pstruh","tuniak"],"zemiaky":["batáty"],"cícer":["fazuľa","šošovica z konzervy"]};
const STAPLE=["soľ","olej","paprika"];
let S={p:[],c:{},d:[],f:[],ph:{},tab:"r",q:"",kf:"airfryer"};
try{const x=localStorage.getItem("af2");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("af2",JSON.stringify(S))}catch(e){alert("Úložisko je plné.")}};
const ALL=()=>R.concat(S.f);
const nm=s=>s.toLowerCase().trim();
const has=i=>S.p.some(p=>p.includes(i)||i.includes(p));
function fav(){const f={};ALL().forEach(r=>{const c=S.c[r.id]||0;if(c)r.i.forEach(i=>{if(!STAPLE.includes(i))f[i]=(f[i]||0)+c})});return Object.entries(f).sort((a,b)=>b[1]-a[1]).map(e=>e[0])}
function card(r,m){const miss=r.i.filter(i=>!has(i));
const pic=S.ph[r.id]?`<img class="ph" src="${S.ph[r.id]}"><div class="mu">📷 Tvoja fotka</div>`:(r.img?`<img class="ph" src="${r.img}" loading="lazy" onerror="this.style.display='none'"><div class="mu">Ilustračná fotka, výsledok sa môže líšiť</div>`:"");
return `<div class="card"><h3>${r.n}${r.k&&r.k!="airfryer"?` <span class="tag">🍳 ${r.k}</span>`:""}</h3><div class="mu">⏱ ${r.t}${S.c[r.id]?" · uvarené "+S.c[r.id]+"×":""}</div>${pic}
<div>${r.i.map(i=>`<span class="tag ${m?(has(i)?"have":"miss"):""}">${i}</span>`).join("")}</div>
${m&&miss.length?`<div class="mu">Chýba: ${miss.map(i=>`<b>${i}</b> → ${(SUB[i]||["—"]).join(" / ")}`).join("; ")}</div>`:""}
${r.real?`<div class="real">👀 <b>Ako to reálne vyzerá:</b> ${r.real}</div>`:""}
<details><summary>Postup</summary><ol>${r.s.map(x=>`<li>${x}</li>`).join("")}</ol>
${r.v?`<a class="btn" href="${r.v}" target="_blank" rel="noopener">▶ Pozrieť video</a>`:""}
<button class="btn" onclick="cook('${r.id}')">✅ Uvarené</button>
<label class="btn" style="background:var(--mu)">📷 Moja fotka<input type="file" accept="image/*" hidden onchange="photo('${r.id}',this)"></label></details></div>`}
function cook(id){S.c[id]=(S.c[id]||0)+1;save();draw()}
function photo(id,el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,700/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.ph[id]=c.toDataURL("image/jpeg",.7);save();draw()};im.src=URL.createObjectURL(f)}
function addP(){document.getElementById("pi").value.split(",").map(nm).filter(Boolean).forEach(x=>{if(!S.p.includes(x))S.p.push(x)});save();draw()}
function delP(i){S.p.splice(i,1);save();draw()}
function addD(){const s=document.getElementById("ds").value,i=nm(document.getElementById("di").value),p=document.getElementById("dp").value,z=+document.getElementById("dz").value||0;if(!i)return;S.d.push({s,i,p,z});save();draw()}
function delD(i){S.d.splice(i,1);save();draw()}
function imp(){const m=document.getElementById("im");try{const a=JSON.parse(document.getElementById("it").value);if(!Array.isArray(a))throw 0;let n=0;a.forEach(x=>{if(x.n&&Array.isArray(x.i)&&Array.isArray(x.s)){x.id=x.id||"i"+Date.now()+Math.random().toString(36).slice(2,6);S.f.push(x);n++}});save();m.textContent="Pridaných receptov: "+n;S.tab="r";draw()}catch(e){m.textContent="Neplatný JSON, skontroluj, či si skopíroval celý text."}}
function delF(){if(confirm("Zmazať všetky pridané recepty?")){S.f=[];save();draw()}}
function draw(){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==S.tab));
let h="";
if(S.tab=="r"){const isA=r=>!r.k||r.k=="airfryer";h=`<div class="chips">${[["všetko","Všetko"],["airfryer","🍟 Airfryer"],["iné","🍳 Iné"]].map(c=>`<span class="tag x ${S.kf==c[0]?"have":""}" onclick="S.kf='${c[0]}';save();draw()">${c[1]}</span>`).join("")}</div><input id="rq" placeholder="Hľadaj (napr. cestoviny, kuracie)" value="${S.q}" oninput="S.q=this.value;draw();document.getElementById('rq').focus()">`+ALL().filter(r=>S.kf=="všetko"||(S.kf=="airfryer"?isA(r):!isA(r))).filter(r=>!S.q||(r.n+" "+r.i.join(" ")).toLowerCase().includes(nm(S.q))).sort((a,b)=>isA(b)-isA(a)).map(r=>card(r,false)).join("")}
if(S.tab=="p"){
const sc=ALL().map(r=>({r,k:r.i.filter(has).length/r.i.length})).sort((a,b)=>b.k-a.k);
h=`<div class="row"><input id="pi" placeholder="napr. kuracie prsia, batáty, cesnak" onkeydown="if(event.key=='Enter')addP()"><button class="btn" onclick="addP()">+</button></div>
<div>${S.p.map((p,i)=>`<span class="tag have x" onclick="delP(${i})">${p} ✕</span>`).join("")||'<span class="mu">Zadaj suroviny oddelené čiarkou.</span>'}</div><br>`+
sc.map(o=>`<div class="mu">Zhoda ${Math.round(o.k*100)} %</div>`+card(o.r,true)).join("")}
if(S.tab=="d"){const f=fav();
h=`<div class="card"><b>⭐ Tvoje obľúbené:</b> ${f.slice(0,5).map(x=>`<span class="tag">${x}</span>`).join("")||'<span class="mu">Klikaj „Uvarené“ pri receptoch a naučím sa, čo varíš najčastejšie.</span>'}</div>
<select id="ds"><option>Lidl</option><option>Billa</option><option>Tesco</option></select>
<input id="di" placeholder="položka, napr. chlieb"><div class="row"><input id="dz" type="number" placeholder="zľava v %"><input id="dp" placeholder="cena (nepovinné)"></div>
<button class="btn" onclick="addD()">Pridať zľavu</button><br><br>`+
S.d.map((d,i)=>({d,i})).sort((a,b)=>(b.d.z||0)-(a.d.z||0)).map(({d,i})=>{const m=f.find(x=>d.i.includes(x)||x.includes(d.i));return `<div class="deal ${d.s}">${d.z>=50?'<span class="rare">🔥 VZÁCNE</span>':""}<div class="pc">${d.z?"-"+d.z+"%":"AKCIA"}</div><div><div class="st">${d.s}</div><div class="it">${d.i}</div>${d.p?`<div>${d.p}</div>`:""}${m?`<div style="font-size:13px">⭐ Robíš často (${m})</div>`:""}</div><span class="x" onclick="delD(${i})">✕ zmazať</span></div>`}).join("")||'<div class="mu">Zatiaľ žiadne zľavy.</div>'}
if(S.tab=="a"){h=`<div class="card"><b>Pridať recepty</b><div class="mu">Skopíruj sem JSON, ktorý ti pošle Claude v chate.</div><textarea id="it" rows="8" placeholder='[{"n":"...","k":"airfryer","t":"...","i":[...],"s":[...],"real":"...","v":"","img":""}]'></textarea><button class="btn" onclick="imp()">Importovať</button><div id="im" class="mu"></div></div>
<div class="mu">Pridaných receptov: ${S.f.length}</div><button class="btn" style="background:var(--mu)" onclick="delF()">Zmazať pridané</button>`}
document.getElementById("v").innerHTML=h}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();draw()});
draw();
</script></body></html>
