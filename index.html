const has=i=>{const n=norm(i),g=GR.find(g=>g.includes(n))||[n];return S.p.some(p=>{const q=norm(p);return q&&g.some(a=>q.includes(a)||a.includes(q))})};
function fav(){const f={};ALL().forEach(r=>{const c=(S.c[r.id]||0)+(S.fv[r.id]?2:0);if(c)r.i.forEach(i=>{if(!STAPLE.includes(i))f[i]=(f[i]||0)+c})});return Object.entries(f).sort((a,b)=>b[1]-a[1]).map(e=>e[0])}
function card(r,m){const miss=r.i.filter(i=>!has(i));
const pic=S.ph[r.id]?`<img class="ph" src="${S.ph[r.id]}"><div class="mu">📷 Tvoja fotka</div>`:(r.img?`<img class="ph" src="${r.img}" loading="lazy" onerror="this.style.display='none'"><div class="mu">Ilustračná fotka, výsledok sa môže líšiť</div>`:"");
return `<div class="card"><span class="x" style="float:right;font-size:26px;line-height:1" onclick="togF('${r.id}')">${S.fv[r.id]?"★":"☆"}</span><h3>${r.n}${r.k&&r.k!="airfryer"?` <span class="tag">🍳 ${r.k}</span>`:""}</h3><div class="mu">⏱ ${r.t}${S.c[r.id]?" · uvarené "+S.c[r.id]+"×":""}</div>${pic}
<div>${r.i.map(i=>`<span class="tag ${m?(has(i)?"have":"miss"):""}">${i}</span>`).join("")}</div>
${m&&miss.length?`<div class="mu">Chýba: ${miss.map(i=>`<b>${i}</b> → ${(SUB[i]||["—"]).join(" / ")}`).join("; ")}</div>`:""}
<details><summary>Postup</summary><details><summary>💡 Základy airfryera</summary><ol><li>Vždy ho predhrej 3 min na teplotu z receptu.</li><li>Nepreplňaj košík, jedlo daj do jednej vrstvy, inak nebude chrumkavé.</li><li>V polovici času pretras košík alebo jedlo obráť.</li><li>Časy sú orientačné, každý airfryer je iný. Pozri sa o 2–3 min skôr.</li><li>Mokré jedlo osuš, inak sa dusí.</li><li>Mäso musí byť vo vnútri prepečené, nie ružové (kuracie 74 °C).</li></ol></details><ol>${r.s.map(x=>`<li>${x}</li>`).join("")}</ol>
${r.v?`<a class="btn" href="${r.v}" target="_blank" rel="noopener">▶ Pozrieť video</a>`:""}
<button class="btn" onclick="cook('${r.id}')">✅ Uvarené</button>
<label class="btn" style="background:var(--mu)">📷 Moja fotka<input type="file" accept="image/*" hidden onchange="photo('${r.id}',this)"></label></details></div>`}
function togF(id){if(S.fv[id])delete S.fv[id];else S.fv[id]=1;save();draw()}
function cook(id){S.c[id]=(S.c[id]||0)+1;save();draw()}
function photo(id,el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,700/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.ph[id]=c.toDataURL("image/jpeg",.7);save();draw()};im.src=URL.createObjectURL(f)}
function addP(){document.getElementById("pi").value.split(",").map(nm).filter(Boolean).forEach(x=>{if(!S.p.includes(x))S.p.push(x)});save();draw()}
function clrP(){if(confirm("Vymazať všetky suroviny?")){S.p=[];save();draw()}}
function delP(i){S.p.splice(i,1);save();draw()}
function addD(){const s=document.getElementById("ds").value,i=nm(document.getElementById("di").value),p=document.getElementById("dp").value,z=+document.getElementById("dz").value||0;if(!i)return;S.d.push({s,i,p,z});save();draw()}
function impD(rep){const m=document.getElementById("dm");try{const a=JSON.parse(document.getElementById("dj").value);if(!Array.isArray(a))throw 0;const ok=a.filter(x=>x.i&&["Lidl","Billa","Tesco"].includes(x.s)).map(x=>({s:x.s,i:nm(x.i),p:x.p||"",z:+x.z||0}));if(rep)S.d=[];S.d=S.d.concat(ok);save();draw();document.getElementById("dm").textContent="Pridaných zliav: "+ok.length}catch(e){m.textContent="Neplatný JSON, skopíruj celý text."}}
function delD(i){S.d.splice(i,1);save();draw()}
function imp(){const m=document.getElementById("im");try{const a=JSON.parse(document.getElementById("it").value);if(!Array.isArray(a))throw 0;let n=0;a.forEach(x=>{if(x.n&&Array.isArray(x.i)&&Array.isArray(x.s)){const j=S.f.findIndex(y=>y.id==x.id||y.n==x.n);if(j>=0){S.f[j]=x;n++;return}x.id=x.id||"i"+Date.now()+Math.random().toString(36).slice(2,6);S.f.push(x);n++}});save();m.textContent="Pridaných receptov: "+n;S.tab="r";draw()}catch(e){m.textContent="Neplatný JSON, skontroluj, či si skopíroval celý text."}}
function impF(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById("it").value=r.result;imp()};r.readAsText(f)}
function delF(){if(confirm("Zmazať všetky pridané recepty?")){S.f=[];save();draw()}}
function draw(){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==S.tab));
let h="";
if(S.tab=="r"){const isA=r=>!r.k||r.k=="airfryer";h=`<div class="chips">${[["všetko","Všetko"],["airfryer","🍟 Airfryer"],["iné","🍳 Iné"]].map(c=>`<span class="tag x ${S.kf==c[0]?"have":""}" onclick="S.kf='${c[0]}';save();draw()">${c[1]}</span>`).join("")}</div><input id="rq" placeholder="Hľadaj (napr. cestoviny, kuracie)" value="${S.q}" oninput="S.q=this.value;draw();document.getElementById('rq').focus()">`+ALL().filter(r=>S.kf=="všetko"||(S.kf=="airfryer"?isA(r):!isA(r))).filter(r=>!S.q||(r.n+" "+r.i.join(" ")).toLowerCase().includes(nm(S.q))).sort((a,b)=>isA(b)-isA(a)).map(r=>card(r,false)).join("")}
if(S.tab=="v"){const L=ALL().filter(r=>S.fv[r.id]);h=L.length?L.map(r=>card(r,false)).join(""):'<div class="card mu">Zatiaľ nemáš žiadny obľúbený recept. Ťukni na ☆ pri recepte.</div>'}
if(S.tab=="p"){
const sc=ALL().map(r=>({r,k:r.i.filter(has).length/r.i.length})).sort((a,b)=>b.k-a.k);
h=`<div class="row"><input id="pi" placeholder="napr. kuracie prsia, batáty, cesnak" onkeydown="if(event.key=='Enter')addP()"><button class="btn" onclick="addP()">+</button></div>
<div>${S.p.map((p,i)=>`<span class="tag have x" onclick="delP(${i})">${p} ✕</span>`).join("")||'<span class="mu">Zadaj suroviny oddelené čiarkou.</span>'}</div>${S.p.length?'<div class="mu">Ťuknutím na surovinu ju odstrániš.</div><button class="btn" style="background:var(--mu)" onclick="clrP()">Vymazať všetko</button>':""}<br>`+
sc.map(o=>`<div class="mu">Zhoda ${Math.round(o.k*100)} %</div>`+card(o.r,true)).join("")}
if(S.tab=="d"){const f=fav();
h=`<div class="card"><b>⭐ Tvoje obľúbené:</b> ${f.slice(0,5).map(x=>`<span class="tag">${x}</span>`).join("")||'<span class="mu">Klikaj „Uvarené“ pri receptoch a naučím sa, čo varíš najčastejšie.</span>'}</div>
<select id="ds"><option>Lidl</option><option>Billa</option><option>Tesco</option></select>
<input id="di" placeholder="položka, napr. chlieb"><div class="row"><input id="dz" type="number" placeholder="zľava v %"><input id="dp" placeholder="cena (nepovinné)"></div>
<button class="btn" onclick="addD()">Pridať zľavu</button><details><summary>📥 Vložiť týždenné zľavy naraz (JSON od Clauda)</summary><textarea id="dj" rows="6" placeholder='[{"s":"Lidl","i":"kuracie prsia","p":"129,90 Kč/kg","z":30}]'></textarea><button class="btn" onclick="impD(false)">Pridať k existujúcim</button><button class="btn" style="background:var(--mu)" onclick="impD(true)">Nahradiť všetky</button><div id="dm" class="mu"></div></details><br>`+
S.d.map((d,i)=>({d,i})).sort((a,b)=>(b.d.z||0)-(a.d.z||0)).map(({d,i})=>{const m=f.find(x=>d.i.includes(x)||x.includes(d.i));return `<div class="deal ${d.s}">${d.z>=50?'<span class="rare">🔥 VZÁCNE</span>':""}<div class="pc">${d.z?"-"+d.z+"%":"AKCIA"}</div><div><div class="st">${d.s}</div><div class="it">${d.i}</div>${d.p?`<div>${d.p}</div>`:""}${m?`<div style="font-size:13px">⭐ Robíš často (${m})</div>`:""}</div><span class="x" onclick="delD(${i})">✕ zmazať</span></div>`}).join("")||'<div class="mu">Zatiaľ žiadne zľavy.</div>'}
if(S.tab=="a"){h=`<div class="card"><b>Pridať recepty</b><div class="mu">Skopíruj sem JSON, ktorý ti pošle Claude v chate.</div><textarea id="it" rows="8" placeholder='[{"n":"...","k":"airfryer","t":"...","i":[...],"s":[...],"real":"...","v":"","img":""}]'></textarea><button class="btn" onclick="imp()">Importovať</button><br><label class="btn" style="background:var(--mu)">📂 Vybrať súbor s receptami<input type="file" accept=".json,.txt" hidden onchange="impF(this)"></label><div id="im" class="mu"></div></div>
<div class="mu">Pridaných receptov: ${S.f.length}</div><button class="btn" style="background:var(--mu)" onclick="delF()">Zmazať pridané</button>`}
document.getElementById("v").innerHTML=h}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();draw()});
draw();
</script></body></html>
