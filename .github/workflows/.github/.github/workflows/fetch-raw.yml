name: Stiahni stranky
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stiahni a zjednodus stranky
        run: |
          mkdir -p raw
          python3 - <<'PY'
          import re, urllib.request
          for line in open("urls.txt", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#") or "|" not in line:
                  continue
              name, url = line.split("|", 1)
              try:
                  req = urllib.request.Request(url.strip(), headers={"User-Agent": "Mozilla/5.0", "Accept-Language": "sk"})
                  html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
                  status = "OK"
              except Exception as e:
                  html, status = "", f"CHYBA: {e}"
              html = re.sub(r"<(script|style|svg|noscript)[\s\S]*?</\1>", "", html)
              html = re.sub(r"\s+", " ", html)
              open(f"raw/{name}.txt", "w", encoding="utf-8").write(html[:80000])
              print(name, status, len(html), "znakov")
          PY
      - name: Uloz vysledok
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add raw
          git commit -m "raw stranky" || echo "nic nove"
          git push
